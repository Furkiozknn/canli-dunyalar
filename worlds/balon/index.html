<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balon · Valley Balloon Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#F97316; --ink:#2b221c; --ink2:#7b6a5d; --glass:rgba(255,250,244,.74); --glass-b:rgba(255,255,255,.62);
  --line:rgba(60,40,25,.10); --chip:rgba(60,40,25,.06); --ok:#3f9a5c; --warn:#c98a12; --bad:#d6453d;
}
body.night{ --glass:rgba(22,24,42,.72); --glass-b:rgba(255,255,255,.10); --ink:#f3eee8; --ink2:#aaa3b8; --line:rgba(255,255,255,.09); --chip:rgba(255,255,255,.07); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2340;font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:700;letter-spacing:.04em;color:#e9d9c6;z-index:50;background:#1b2340;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
.glass{background:var(--glass);backdrop-filter:blur(10px) saturate(1.25);-webkit-backdrop-filter:blur(10px) saturate(1.25);border:1px solid var(--glass-b);border-radius:16px;box-shadow:0 10px 30px rgba(40,24,12,.16)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ico{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#topbar{position:fixed;top:12px;left:12px;right:12px;height:56px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;z-index:14}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.logo small{display:block;font-weight:600;font-size:10.5px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.logo .mark{width:32px;height:32px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff}
.search{position:relative;flex:0 1 230px;min-width:120px}
.search input{width:100%;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--chip);padding:0 12px 0 34px;font:inherit;font-size:13.5px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.search .ico{position:absolute;left:10px;top:9px;color:var(--ink2)}
.dropdown{position:absolute;top:44px;left:0;min-width:230px;padding:6px;display:none;z-index:20;max-height:340px;overflow:auto;background:rgba(255,250,244,.96)}
body.night .dropdown{background:rgba(26,28,48,.96)}
.dropdown.open{display:block}
.dd-item{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:13.5px}
.dd-item:hover,.dd-item.on{background:var(--chip)}
.dd-item span{color:var(--ink2);font-size:11.5px}
#areas{display:flex;gap:3px;background:var(--chip);border-radius:12px;padding:3px;overflow:hidden}
#areas button{padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink2)}
#areas button:hover{color:var(--ink)}
#areas button.on{background:var(--acc);color:#fff}
#areaSelect{display:none;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:13px;padding:0 8px}
.spacer{flex:1}
.tb-btn{height:36px;min-width:36px;padding:0 10px;border-radius:11px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;background:var(--chip);position:relative;white-space:nowrap}
.tb-btn:hover{background:rgba(249,115,22,.12)}
.menuwrap{position:relative}
.menuwrap .dropdown{left:auto;right:0}
#clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;padding:0 6px;white-space:nowrap}
#clock small{font-weight:600;color:var(--ink2);font-size:11px;margin-left:4px}
#alertBadge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--acc);color:#fff;font-size:10.5px;font-weight:800;display:none;place-items:center}
#alertsMenu{width:340px}
.alert{display:flex;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.5px;line-height:1.35}
.alert b{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:700;min-width:38px}
.alert i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:#6b8fb8}
.alert.warn i{background:var(--warn)} .alert.bad i{background:var(--bad)} .alert.ok i{background:var(--ok)}
#kpis{position:fixed;top:80px;left:12px;display:flex;gap:10px;z-index:5}
.kpi{width:178px;padding:12px 14px 12px}
.kpi .k{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:13px;color:var(--ink2);font-weight:700;margin-left:3px}
.kpi .bar{height:4px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.kpi .bar div{height:100%;background:var(--acc);border-radius:3px;transition:width .5s}
#detail{position:fixed;top:80px;right:12px;width:320px;max-height:calc(100% - 352px);overflow:auto;padding:16px;z-index:6;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
#detail.hidden{transform:translateX(30px);opacity:0;pointer-events:none}
.d-type{font-size:11px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
.d-name{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 2px}
.d-sub{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.d-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--chip)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--chip);border-radius:11px;padding:9px 10px;min-width:0}
.stat .k{font-size:10.5px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:16px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.stat.wide{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--chip)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pill.warn i{background:var(--warn)} .pill.bad i{background:var(--bad)} .pill.idle i{background:#9a8f86}
.meter{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.meter div{height:100%;background:var(--acc)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:2px}
.d-list{margin-top:10px;font-size:12.5px}
.d-list div{display:flex;justify-content:space-between;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
.d-list div span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
#tracker{position:fixed;left:12px;bottom:12px;width:440px;padding:14px 16px 16px;z-index:5}
.t-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.t-head b{font-size:14px;white-space:nowrap} .t-head span{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.steps{display:flex;align-items:flex-start;position:relative}
.step{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink2);position:relative}
.step .dot{width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:var(--glass);border:2px solid var(--line);position:relative;z-index:1}
.step::before{content:'';position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done .dot{background:var(--acc);border-color:var(--acc)} .step.done::before{background:var(--acc)}
.step.now .dot{background:#fff;border-color:var(--acc);box-shadow:0 0 0 4px rgba(249,115,22,.22)} .step.now{color:var(--ink)} .step.now::before{background:var(--acc)}
.t-empty{font-size:13px;color:var(--ink2);padding:6px 0 2px}
#tablebox{position:fixed;right:12px;bottom:12px;width:min(640px,calc(100% - 480px));height:250px;display:flex;flex-direction:column;z-index:5;overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px 10px 6px;align-items:center}
.tabs button{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.tabs button.on{background:var(--chip);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.tabs .live{margin-left:auto;font-size:11px;font-weight:800;color:var(--acc);display:flex;align-items:center;gap:6px;padding-right:6px}
.tabs .live i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.tbl{overflow:auto;flex:1;padding:0 6px 8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--glass);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:800;padding:6px 8px;backdrop-filter:blur(6px)}
td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer} tr.row:hover td{background:var(--chip)} tr.row.sel td{background:rgba(249,115,22,.10)}
td b{font-weight:800}
#hint{position:fixed;left:calc(50% + 150px);transform:translateX(-50%);top:84px;transition:opacity .8s;font-size:12px;color:var(--ink2);padding:7px 12px;border-radius:20px;z-index:4;white-space:nowrap;pointer-events:none}
#label{position:fixed;left:0;top:0;z-index:4;pointer-events:none;transform:translate(-50%,-100%);display:none}
#label .lb{background:var(--acc);color:#fff;font-weight:800;font-size:13px;padding:6px 11px;border-radius:10px;box-shadow:0 6px 16px rgba(249,115,22,.35);white-space:nowrap}
#label .lb small{display:block;font-weight:600;font-size:11px;opacity:.9}
#label::after{content:'';display:block;width:2px;height:16px;background:var(--acc);margin:0 auto}
.mini-steps{display:none}
#tableToggle{display:none}
body.record, body.record *{cursor:none!important}
body.record .chrome{display:none!important}
body.record #kpis{top:16px;left:16px}
@media (max-width: 1150px){ #areas{display:none} #areaSelect{display:block} #tablebox{width:calc(100% - 480px)} }
@media (max-width: 1000px) and (min-width: 721px){
  .logo small{display:none} .search{flex:0 1 150px} #weatherName{display:none} #hint{display:none}
  #topbar{gap:6px;padding:0 8px 0 10px} .tb-btn{min-width:34px;padding:0 8px} #areaSelect{max-width:128px} #clock{font-size:14px;padding:0 2px} #clock small{display:none}
  .kpi{width:150px;padding:10px 12px} .kpi .v{font-size:22px} .kpi .k{font-size:9.5px;white-space:nowrap}
  #tracker{width:340px;padding:12px 12px 14px} .step{font-size:9.5px}
  #detail{width:290px;top:178px;max-height:calc(100% - 340px);padding:14px} .d-name{font-size:19px}
  #tableToggle{display:flex} #tablebox{display:none;width:auto;left:364px;height:220px} #tablebox.open{display:flex}
}
@media (max-width: 720px){
  #topbar{height:auto;flex-wrap:wrap;padding:8px;gap:6px;top:8px;left:8px;right:8px}
  .logo small{display:none} .search{order:5;flex:1 1 100%} .spacer{display:none} #weatherName{display:none}
  #kpis{top:auto;bottom:12px;left:8px;right:8px;gap:6px}
  .kpi{flex:1;width:auto;padding:8px 10px;min-width:0} .kpi .v{font-size:18px} .kpi .k{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tracker,#hint{display:none}
  #tableToggle{display:flex}
  #tablebox{left:8px;right:8px;width:auto;bottom:86px;height:42vh;display:none} #tablebox.open{display:flex}
  #detail{top:auto;bottom:0;left:0;right:0;width:auto;max-height:58vh;border-radius:20px 20px 0 0;padding:20px 16px 18px;z-index:12}
  #detail::before{content:'';position:absolute;top:7px;left:50%;width:40px;height:4px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
  #detail.hidden{transform:translateY(105%)}
  .mini-steps{display:flex;margin:12px 0 4px}
}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   FLAGS, RNG, HELPERS
   ============================================================ */
const QS = new URLSearchParams(location.search);
const LOW = QS.has('low');
const RECORD = QS.has('record');
let _seed = 5150611;
function rand(){ _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a,b)=> a + (b-a)*rand();
const pick = arr => arr[Math.floor(rand()*arr.length)];
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const smooth = (a,b,v)=>{ const t = clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
const TAU = Math.PI*2;
const pad = n => String(n).padStart(2,'0');
const PART = LOW ? 0.5 : 1;   // particle multiplier

/* ============================================================
   GEOGRAPHY  (valley axis u runs NW -> SE, vv across the valley)
   ============================================================ */
const S2 = Math.SQRT1_2, EU = [S2, S2], EV = [S2, -S2];
const meander = u => 34*Math.sin(u*0.0085 + 0.6) + 14*Math.sin(u*0.021 + 2.0);
const fromUV = (u, vv) => { const v = vv + meander(u); return [(u+v)*S2, (u-v)*S2]; };
const toUV = (x, z) => { const u = (x+z)*S2; return [u, (x-z)*S2 - meander(u)]; };
const halfW = (u, vv) => 108 + 22*Math.sin(u*0.011 - 0.6) + (vv > 0 ? 58*Math.exp(-(((u+40)/72)**2)) : 0);
const roadVV = u => 8 + 14*Math.sin(u*0.016 + 1.0);
const loc = (C, du, dv) => [C[0] + EU[0]*du + EV[0]*dv, C[1] + EU[1]*du + EV[1]*dv];
const toLoc = (C, x, z) => { const dx = x - C[0], dz = z - C[1]; return [dx*EU[0] + dz*EU[1], dx*EV[0] + dz*EV[1]]; };
const yawOf = (dx, dz) => Math.atan2(dx, dz);

const FIELDS = [
  { id:'fieldA', type:'field', name:'Kayaönü', u:-310, vv:-50 },
  { id:'fieldB', type:'field', name:'Yelbayırı', u:-275, vv:78 },
  { id:'fieldC', type:'field', name:'Taşlık', u:-200, vv:-68 },
];
FIELDS.forEach(f => { f.c = fromUV(f.u, f.vv); f.rs = Math.sign(roadVV(f.u) - f.vv) || 1; f.label = f.name + ' launch field'; });
const MEADOW = { c: fromUV(262, 5), name:'Çayırbaşı meadow' };
const HOTEL = { c: fromUV(150, -150), ru:36, rv:24, H:50 };
const VILLAGE = { c: fromUV(70, -92) };
const ROSE = { lanes:[62, 112], u0:-170, u1:45 };
const MAST = fromUV(-245, 22), CABIN = fromUV(-233, 38);
const VINE_P = [[-170,-125,-108,-74],[-95,-50,-72,-38],[-10,40,-78,-45],[95,135,30,72],[118,148,-84,-56]];
const ORCH_P = [[-150,-105,16,50],[30,62,22,48],[96,128,-40,-18],[-60,-25,-34,-12]];

function baseHeight(x, z){
  const u = (x+z)*S2, vv = (x-z)*S2 - meander(u);
  const W = halfW(u, vv), a = Math.abs(vv);
  let h = 1.1*Math.sin(x*0.031)*Math.sin(z*0.027) + 0.6*Math.sin(x*0.011 + z*0.017);
  const t = smooth(W, W + 95, a);
  if (t > 0){
    const P = 60 + 16*Math.sin(u*0.013 + 0.4) + 9*Math.sin(vv*0.017 + u*0.004);
    const q = t*3, fq = q - Math.floor(q);
    const st = Math.min(1, (Math.floor(q) + smooth(0.3, 1.0, fq))/3);
    h += P*st + 3.0*Math.sin(x*0.031 + z*0.019)*Math.sin(z*0.027 - x*0.013)*t;
  }
  for (const f of FIELDS){ const d = Math.hypot(x - f.c[0], z - f.c[1]); if (d < 78) h = lerp(0.3, h, smooth(56, 78, d)); }
  { const [du, dv] = toLoc(MEADOW.c, x, z); const k = Math.max(Math.abs(du)/118, Math.abs(dv)/84); if (k < 1.3) h = lerp(0.5, h, smooth(1.0, 1.3, k)); }
  { const [du, dv] = toLoc(HOTEL.c, x, z); const e = Math.hypot(du/HOTEL.ru, dv/HOTEL.rv);
    if (e < 1.6){
      const top = HOTEL.H + 2.5*Math.sin(du*0.2) + 1.5*Math.sin(dv*0.3);
      h = Math.max(h, top*(1 - smooth(0.9, 1.0, e)), 14*(1 - smooth(1.0, 1.55, e)));
    }
  }

function makePath(pts){ const cum=[0]; for (let i=1;i<pts.length;i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1])); return { pts, cum, len:cum[cum.length-1] }; }
function samplePath(P, s){
  s = clamp(s, 0, P.len); let lo = 0, hi = P.cum.length-1;
  while (hi - lo > 1){ const m = (lo+hi)>>1; if (P.cum[m] <= s) lo = m; else hi = m; }
  const a = P.pts[lo], b = P.pts[hi], L = (P.cum[hi]-P.cum[lo]) || 1, t = (s - P.cum[lo])/L;
  return { x: lerp(a[0],b[0],t), z: lerp(a[1],b[1],t), dx:(b[0]-a[0])/L, dz:(b[1]-a[1])/L };
}
const JUNC = [
  ...FIELDS.map(f => ({ id:'j'+f.id, name: f.name + ' turn-off', c: f.J, lock:null })),
  { id:'jv', name:'Village junction', c: ROAD[roadIdx(70)], lock:null },
  { id:'jh', name:'Cave hotel junction', c: ROAD[roadIdx(150)], lock:null },
  { id:'jg', name:'Meadow gate', c: ROAD[ROAD.length-1], lock:null },
];
function lanePath(raw){
  const P = resample(raw, 2), out = [], n = P.length;
  let s = 0; const cum = [0]; for (let i=1;i<n;i++) cum.push(cum[i-1] + Math.hypot(P[i][0]-P[i-1][0], P[i][1]-P[i-1][1])); const L = cum[n-1];
  for (let i=0;i<n;i++){
    const a = P[Math.max(0,i-2)], b = P[Math.min(n-1,i+2)], dx = b[0]-a[0], dz = b[1]-a[1], l = Math.hypot(dx,dz) || 1;
    const k = 2.2*Math.min(1, cum[i]/6, (L - cum[i])/6);
    out.push([P[i][0] - dz/l*k, P[i][1] + dx/l*k]);
  }
  const path = makePath(out);
  path.junc = [];
  for (const j of JUNC){
    let sIn = -1, sOut = -1;
    for (let i=0;i<out.length;i++){ if (Math.hypot(out[i][0]-j.c[0], out[i][1]-j.c[1]) < 11){ if (sIn < 0) sIn = path.cum[i]; sOut = path.cum[i]; } }
    if (sIn >= 0) path.junc.push({ j, sIn, sOut });
  }
  return path;
}

function setPhase(b, ph){ b.phase = ph; b.phaseT = 0; }
function reserveBand(b){
  if (b.band >= 0) return true;
  let best = -1, bestScore = 1e9;
  BANDS.forEach((alt, i) => { const n = BAND_USE[i].length; if (n >= 2) return; const score = n*10 + Math.abs(i - (b.idx*3) % 8)*0.5; if (score < bestScore){ bestScore = score; best = i; } });
  if (best < 0) return false;
  b.band = best; BAND_USE[best].push(b); return true;
}
function releaseBand(b){ if (b.band >= 0){ const L = BAND_USE[b.band]; const i = L.indexOf(b); if (i >= 0) L.splice(i, 1); b.band = -1; } }
function reserveLanding(b){
  if (b.land) return true;
  const s = LANDS.find(l => !l.res); if (!s) return false;
  s.res = b; b.land = s; return true;
}
function clearance(b){
  for (const o of BAL){ if (o === b || !o.air) continue; if (Math.hypot(o.x - b.x, o.z - b.z) < 60 && o.y - b.y < 85) return o; }
  return null;
}

/* status helpers */
function stageOf(b){
  switch (b.phase){
    case 'packed': return b.done ? 6 : 0;
    case 'unload': case 'cold': return 0;
    case 'hot': return 1;
    case 'board': return 2;
    case 'ready': return 3;
    case 'flying': return b.flightT < 22 ? 3 : 4;
    default: return 5;
  }
}
function statusOf(b){
  switch (b.phase){
    case 'packed': return b.done ? 'Flight complete · packed' : ENV.gusty ? 'Held on ground (gusts)' : 'Packed on trailer';
    case 'unload': return 'Unloading basket';
    case 'cold': return 'Cold inflation · fan running';
    case 'hot': return 'Hot inflation · burner firing';
    case 'board': return 'Boarding passengers';
    case 'ready': return b.waitWhy || 'Ready for lift-off';
    case 'flying': return b.sep ? (b.sep.mode === 'climb' ? `Climbing clear of ${b.sep.o.name}` : `Holding altitude · ${b.sep.o.name} ${Math.round(b.sep.h)} m`) : legName(b);
    case 'landed': return b.truck.state === 'onsite' ? 'Landed · crew on site' : 'Landed · waiting for chase crew';
    case 'deflate': return 'Deflating envelope';
    case 'pack': return 'Packing envelope';
    case 'stowed': return 'On trailer · returning to ' + b.field.name;
  }
  return b.phase;
}
function truckStatus(k){
  if (k.state === 'parked') return k.b.phase === 'stowed' ? 'Parked' : 'Parked at ' + k.b.field.name;
  if (k.state === 'out') return k.waitJ ? 'Waiting at ' + k.waitJ.name : 'Driving to landing point ' + (k.b.land ? k.b.land.id : '');
  if (k.state === 'wait') return 'At landing point ' + (k.b.land ? k.b.land.id : '') + ', waiting';
  if (k.state === 'onsite') return 'Recovering ' + k.b.name;
  if (k.state === 'back') return k.waitJ ? 'Waiting at ' + k.waitJ.name : 'Returning to ' + k.b.field.name;
  return k.state;
}
const pillCls = st => /Held|gusts/i.test(st) ? 'bad' : /Holding|Waiting|Climbing clear/i.test(st) ? 'warn' : /complete|Packed|Parked/i.test(st) ? 'idle' : '';
function zoneOf(x, z){
  for (const f of FIELDS) if (Math.hypot(x - f.c[0], z - f.c[1]) < 70) return f.name + ' field';
  { const [du, dv] = toLoc(MEADOW.c, x, z); if (Math.abs(du) < 130 && Math.abs(dv) < 95) return 'Landing meadow'; }
  const [u, vv] = toUV(x, z);
  if (u > ROSE.u0 - 10 && u < ROSE.u1 + 10 && vv > 25) return 'Rose valley';
  if (Math.hypot(x - VILLAGE.c[0], z - VILLAGE.c[1]) < 80) return 'Village';
  if (Math.hypot(x - HOTEL.c[0], z - HOTEL.c[1]) < 90) return 'Cave hotel';
  return u < -150 ? 'Upper valley' : u < 120 ? 'Mid valley' : 'Lower valley';
}
const aglOf = b => b.air ? Math.max(0, b.y - groundAt(b.x, b.z)) : 0;
function etaLanding(b){
  if (!b.air) return null; let d = 0, px = b.x, pz = b.z;
  for (let w = b.wp; w < b.route.length; w++){ const p = b.route[w].p; d += Math.hypot(p[0]-px, p[1]-pz); px = p[0]; pz = p[1]; }
  return SIM.min + (d/3.6 + 25)*SIM.rate;
}
function surfaceTemp(){ const h = (SIM.min % 1440)/60; return 2 + 6*smooth(5.8, 8.5, h) - (ENV.weather === 'snow' ? 5 : ENV.weather === 'mist' ? 1 : 0); }
function tempAt(alt){ return surfaceTemp() + 3*smooth(0, 120, alt) - 0.0065*Math.max(0, alt - 120); }

  $('kPax').textContent = pax.toLocaleString('en'); $('kPaxBar').style.width = (pax/capAll*100) + '%';
  $('kWind').innerHTML = (w.s*KN).toFixed(1) + `<small>kn ${fromDir(w.th).name}</small>`; $('kWindBar').style.width = Math.min(100, w.s*KN/25*100) + '%';
  $('clock').innerHTML = fmtTime(SIM.min) + `<small>DAY ${MISSION.day}</small>`;
}
let uiT = 0, tblT = 0;
function updateUI(dt){
  uiT += dt; tblT += dt;
  if (uiT > 0.25){ uiT = 0; renderKpis(); if (SEL) renderDetail(); renderTracker(); }
  if (tblT > 0.6){ tblT = 0; if (!document.querySelector('#tbl tr.row:hover')) renderTable(); }
}
setTimeout(() => { $('hint').style.opacity = 0; }, 14000);

/* ============================================================
   WEATHER + LIGHT (pre-dawn blue -> golden sunrise)
   ============================================================ */
const WX = {
  calm:  { windMul:1.0, gust:0.15, mist:0,    snow:0, dust:0, near:900, far:2600, sunMul:1.0,  tint:'#ffffff', tintK:0 },
  gusty: { windMul:2.3, gust:0.55, mist:0,    snow:0, dust:1, near:650, far:2200, sunMul:0.88, tint:'#e6d4b6', tintK:0.35 },
  mist:  { windMul:0.7, gust:0.08, mist:1,    snow:0, dust:0, near:180, far:1300, sunMul:0.72, tint:'#ece9e4', tintK:0.6 },
  snow:  { windMul:0.9, gust:0.18, mist:0.2,  snow:1, dust:0, near:320, far:1700, sunMul:0.7,  tint:'#dde4ec', tintK:0.5 },
};
const KS = [-0.25, 0, 0.18, 0.32, 0.5, 0.75, 1.0];
const kfc = arr => arr.map(c => new THREE.Color(c));
const SKY_TOP = kfc(['#04071a','#0f1838','#2b3a6b','#4f6799','#7d9cc8','#a3bedc','#b6cce0']);
const SKY_HOR = kfc(['#101833','#283462','#8c6d8a','#f0a46e','#f5c595','#f2dcc0','#eee4d3']);
const SUN_COL = kfc(['#7486c8','#8a9bd6','#c58fa0','#ff9750','#ffbe82','#ffe0b8','#fff2df']);
const SUN_I = [0.5, 0.48, 0.5, 1.25, 1.95, 2.35, 2.55];
const HEMI_I = [0.62, 0.62, 0.66, 0.78, 0.98, 1.08, 1.15];
const HEMI_SKY = kfc(['#5a6aa8','#5f6fa6','#8a7fa8','#e2b39a','#f0d3b8','#f2e6d6','#f6efe4']);
const HEMI_GND = kfc(['#241c22','#2e242a','#5a4638','#8a6a52','#b2906f','#c3a283','#c9a986']);
function kfIndex(s){ s = clamp(s, KS[0], KS[KS.length-1]); let i = 0; while (i < KS.length - 2 && s > KS[i+1]) i++; return [i, (s - KS[i])/(KS[i+1] - KS[i])]; }
const kfColor = (arr, s, out) => { const [i, f] = kfIndex(s); return out.copy(arr[i]).lerp(arr[i+1], f); };
const kfNum = (arr, s) => { const [i, f] = kfIndex(s); return lerp(arr[i], arr[i+1], f); };
const tmpC = new THREE.Color(), tmpC2 = new THREE.Color(), tintC = new THREE.Color();
const CAP_COL = new THREE.Color('#7a6152'), SNOWC = new THREE.Color('#f4f6f8');
applyWeather = (key, silent=false) => {
  if (!WX[key]) return;
  const prev = ENV.weather; ENV.weather = key; const wasGusty = ENV.gusty; ENV.gusty = key === 'gusty';
  setWeatherButton(key);
  if (silent || prev === key) return;
  if (key === 'gusty') pushAlert('Gusts 22 kn at the launch fields: all launches held, airborne balloons land early at the meadow.', 'bad');
  else if (wasGusty) pushAlert('Gusts eased: launches resume in sequence.', 'ok');
  if (key === 'mist') pushAlert('Morning mist pooling in the valleys: VFR above 60 m, pilots climb out of the mist.', 'warn');
  if (key === 'snow') pushAlert('Light snow: rock caps whitening, cold launch procedures in effect.', 'info');
  if (key === 'calm' && !wasGusty) pushAlert('Calm dawn: light winds, all flights go.', 'ok');
};
toggleNight = () => { ENV.forceNight = !ENV.forceNight; };
function renderDayBtn(){ $('dayNight').innerHTML = ENV.forceNight ? ICON.sun : ICON.moon; $('dayNight').title = ENV.forceNight ? 'Back to dawn light' : 'Switch to night'; }
const sunDir = new THREE.Vector3(), moonDir = new THREE.Vector3(-0.42, 0.78, 0.46).normalize(), lightDir = new THREE.Vector3();
let dayBtnState = -1;
function updateEnvironment(dt, t){
  const tg = WX[ENV.weather], k = 1 - Math.exp(-dt*1.1);
  for (const key of ['windMul','gust','mist','snow','dust','near','far','sunMul']) CUR[key] += (tg[key] - CUR[key])*k;
  tintC.lerp(tmpC.set(tg.tint), k); CUR.tintK = (CUR.tintK ?? 0) + (tg.tintK - (CUR.tintK ?? 0))*k;
  const hour = (SIM.min % 1440)/60, sAuto = clamp((hour - 5.45)/2.1, 0, 1);
  const sT = ENV.forceNight ? -0.25 : sAuto;
  CUR.s += (sT - CUR.s)*(1 - Math.exp(-dt*0.9));
  const s = CUR.s; ENV.s = s; ENV.night = 1 - smooth(0.12, 0.45, s);
  // sun path: rises from the east-south-east
  const elev = lerp(-10, 30, clamp(s, 0, 1))*Math.PI/180, ce = Math.cos(elev);
  sunDir.set(ce*0.93, Math.sin(elev), ce*0.36).normalize();
  const m = smooth(0.1, -0.06, Math.sin(elev));
  const se = Math.max(Math.sin(elev), Math.sin(9*Math.PI/180)); lightDir.set(sunDir.x, se, sunDir.z).normalize().lerp(moonDir, m).normalize();
  sun.position.copy(lightDir).multiplyScalar(800); sun.target.position.set(0, 0, 0);
  const wl = 1 - CUR.tintK*0.35;
  sun.intensity = kfNum(SUN_I, s)*CUR.sunMul; kfColor(SUN_COL, s, sun.color);
  hemi.intensity = kfNum(HEMI_I, s)*(0.8 + 0.2*wl); kfColor(HEMI_SKY, s, hemi.color); kfColor(HEMI_GND, s, hemi.groundColor);
  // sky + fog
  const lum = lerp(0.18, 1, clamp(s + 0.15, 0, 1));
  kfColor(SKY_TOP, s, skyU.uTop.value).lerp(tmpC.copy(tintC).multiplyScalar(lum*0.9), CUR.tintK*0.5);
  kfColor(SKY_HOR, s, skyU.uHor.value).lerp(tmpC.copy(tintC).multiplyScalar(lum), CUR.tintK*0.7);
  skyU.uSunDir.value.copy(sunDir); skyU.uSunCol.value.copy(sun.color).multiplyScalar(smooth(-0.05, 0.25, s)*(1 - CUR.tintK*0.6));
  skyU.uGround.value.copy(skyU.uHor.value).multiplyScalar(0.55);
  sky.position.copy(camera.position);
  scene.fog.color.copy(skyU.uHor.value); scene.fog.near = CUR.near; scene.fog.far = CUR.far;
  SKY_C.copy(skyU.uHor.value);
  document.body.style.background = '#' + skyU.uHor.value.getHexString();
  // glows
  const gk = 1 - smooth(0.1, 0.5, s);
  glowWarm.emissiveIntensity = 0.15 + gk*1.35;
  envU.uGlowK.value = 0.55 + gk*3.4;
  starPts.material.opacity = smooth(0.14, -0.1, s)*(1 - CUR.tintK*0.8);
  // snow on caps + terrain
  snowU.value = CUR.snow;
  capMat.color.copy(CAP_COL).lerp(SNOWC, CUR.snow*0.95);
  // instruments
  const sw = windAt(MAST[0], MAST[1], 30, t);
  anemo.rotation.y += sw.s*1.6*dt; vane.rotation.y = sw.th + Math.PI;
  sock.rotation.set(-0.9*(1 - smooth(1.5, 7, sw.s)), sw.th + Math.PI, 0, 'YXZ');
  const nightState = ENV.forceNight ? 1 : 0;
  if (nightState !== dayBtnState){ dayBtnState = nightState; renderDayBtn(); }
  document.body.classList.toggle('night', ENV.night > 0.55);
}

/* ============================================================
   ?record : cinematic camera gliding between areas and balloons
   ============================================================ */
const CINE = { i:0, t:0, n:0 };
if (RECORD){ document.body.classList.add('record'); controls.enabled = false; }
function updateCinematic(dt){
  if (!RECORD) return;
  CINE.t -= dt;
  if (CINE.t <= 0){
    CINE.n++;
    const flying = BAL.filter(b => b.air && b.flightT > 15);
    if (CINE.n % 2 === 0 && flying.length){
      const b = flying[CINE.n % flying.length], off = new THREE.Vector3(-110, 50, -90).applyAxisAngle(UP, rr(-0.6, 0.6));
      flyTo(b.pos, b.pos.clone().add(off), 5, b); SEL = null; CINE.follow = b; CINE.t = 12;
    } else {
      CINE.follow = null; CINE.i = (CINE.i + 1) % AREAS.length;
      const a = AREAS[CINE.i], tgt = new THREE.Vector3(...a.t), c = new THREE.Vector3(...a.c), off = c.clone().sub(tgt).applyAxisAngle(UP, rr(-0.5, 0.5));
      flyTo(tgt, tgt.clone().add(off), 6.5); CINE.t = 13;
    }
  }
  if (!FLY.active){
    if (CINE.follow){ const d = _v.copy(CINE.follow.pos).sub(controls.target).multiplyScalar(1 - Math.exp(-dt*3)); controls.target.add(d); camera.position.add(d); }
    const off = _v.copy(camera.position).sub(controls.target); off.applyAxisAngle(UP, dt*0.05); camera.position.copy(controls.target).add(off);
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = { last: performance.now(), t: 0 };
function newDay(){
  SIM.min = 5*60 + 40; MISSION.day++; MISSION.t = 0; scheduleDay();
  BAL.forEach(b => { b.done = false; b.fuel = rr(96, 100); b.pax = b.cap - Math.floor(rand()*3); b.maxAlt = 0; });
  pushAlert(`Day ${MISSION.day} · 05:40 dawn briefing done: crews at the launch fields, cold inflation begins.`, 'info');
}
function simStep(dt){
  clock.t += dt; SIM.min += dt*SIM.rate; MISSION.t += dt;
  for (const b of BAL){ if (!b.air) updateBalloonGround(b, dt); burnerLogic(b, dt); }
  updateFlight(dt, clock.t);
  updateTrucks(dt);
  if (BAL.every(b => b.phase === 'packed' && b.done)) newDay();
  updateEnvironment(dt, clock.t);
  poseBalloons(clock.t);
  updatePeople(dt, clock.t);
  updateBirds(dt, clock.t);
  updateParticles(dt, clock.t);
}
function update(dt){
  simStep(dt);
  updateCinematic(dt);
  updateCamera(dt);
  updateSelectionFx(clock.t);
  updateUI(dt);
}
function frame(now){
  const dt = Math.min(0.05, (now - clock.last)/1000); clock.last = now;
  update(dt); controls.update(); clampCamera();
  renderer.render(scene, camera);
}
pushAlert('Day 1 · 05:40 dawn briefing done: 12 balloons cleared, cold inflation begins at the launch fields.', 'info');
renderAlerts(); renderTable(); renderTracker(); renderKpis();
// settle the light before the first frame
CUR.s = clamp(((SIM.min % 1440)/60 - 5.45)/2.1, 0, 1); updateEnvironment(0.016, 0);
// deep links: ?t=<sim seconds to fast-forward>&wx=<weather>&area=<index>&sel=<object id>&night
{
  const ff = Math.min(1800, +QS.get('t') || 0); for (let i=0; i<ff*30; i++) simStep(1/30);
  if (QS.has('wx')){ applyWeather(QS.get('wx')); for (let i=0; i<8*30; i++) simStep(1/30); }
  if (QS.has('night')) { ENV.forceNight = true; CUR.s = -0.25; }
  if (QS.has('area')) goArea(+QS.get('area') || 0, 0.01);
  if (QS.has('sel')) { const o = CLICK.find(o => o.id === QS.get('sel')); if (o){ select(o); FLY.dur = 0.01; } }
  if (ff || QS.has('area') || QS.has('sel')){ for (let i=0;i<4;i++) update(1/60); renderKpis(); renderAlerts(); renderTable(); renderTracker(); renderDetail(); }
}
renderer.setAnimationLoop(frame);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) renderer.setAnimationLoop(null);
  else { clock.last = performance.now(); renderer.setAnimationLoop(frame); }
});
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setInterval(() => { if (!document.hidden) console.log(`[Balon] draw calls: ${renderer.info.render.calls} | triangles: ${renderer.info.render.triangles} | low=${LOW} record=${RECORD}`); }, 5000);
// test hooks
function sepCheck(){
  const out = { flyPairs:0, violations:0, overlap:0, minH:Infinity, minGapClose:Infinity, worst:null };
  const fly = BAL.filter(b => b.air), fixed = BAL.filter(isStanding);
  for (let i=0;i<fly.length;i++){
    for (let j=i+1;j<fly.length;j++){ const a = fly[i], o = fly[j], h = Math.hypot(a.x-o.x, a.z-o.z), g = Math.abs(a.y-o.y); out.flyPairs++;
      if (h < out.minH) out.minH = h; if (h < SEP.H && g < out.minGapClose) out.minGapClose = g;
      if (h < SEP.H && g < 30){ out.violations++; out.worst = { a:a.name, b:o.name, h, g }; } }
    for (const f of fixed){ const a = fly[i], h = Math.hypot(a.x-f.x, a.z-f.z), g = a.y - f.y; if (h < 22 && g < 30){ out.overlap++; out.worst = { a:a.name, b:f.name, h, g, fixed:true }; } }
  }
  return out;
}
window.__balon = { THREE, scene, camera, controls, renderer, BAL, TRUCKS, JUNC, SIM, ENV, MISSION, ALERTS, LANDS, BAND_USE, simStep, update, sepCheck,
  setWeather: k => applyWeather(k), toggleNight: () => toggleNight(), select: id => select(CLICK.find(o => o.id === id)), goArea, info: () => renderer.info.render };
document.getElementById('boot').classList.add('done');
</script>
