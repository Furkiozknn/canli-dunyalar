<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vapur · Strait Ferry Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E30A17; --ink:#1c2a2e; --ink2:#5a6b70; --glass:rgba(251,248,242,.74); --glass-b:rgba(255,255,255,.6);
  --line:rgba(28,42,46,.09); --chip:rgba(28,42,46,.06); --teal:#1f8a86; --ok:#2f9a62; --warn:#c98a12;
}
body.night{ --glass:rgba(18,30,38,.72); --glass-b:rgba(255,255,255,.10); --ink:#eef3f1; --ink2:#9fb3b7; --line:rgba(255,255,255,.09); --chip:rgba(255,255,255,.07); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe9e6;font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:700;letter-spacing:.04em;color:#5a6b70;z-index:50;background:#e9efec;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
.glass{background:var(--glass);backdrop-filter:blur(10px) saturate(1.25);-webkit-backdrop-filter:blur(10px) saturate(1.25);border:1px solid var(--glass-b);border-radius:16px;box-shadow:0 10px 30px rgba(18,38,44,.13)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ico{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#topbar{position:fixed;top:12px;left:12px;right:12px;height:56px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;z-index:10}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.logo small{display:block;font-weight:600;font-size:10.5px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.logo .mark{width:32px;height:32px;border-radius:10px;background:var(--red);display:grid;place-items:center;color:#fff}
.search{position:relative;flex:0 1 230px;min-width:120px}
.search input{width:100%;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--chip);padding:0 12px 0 34px;font:inherit;font-size:13.5px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,10,23,.12)}
.search .ico{position:absolute;left:10px;top:9px;color:var(--ink2)}
.dropdown{position:absolute;top:44px;left:0;min-width:230px;padding:6px;display:none;z-index:20;max-height:320px;overflow:auto;background:rgba(251,248,242,.96)}
body.night .dropdown{background:rgba(22,34,44,.96)}
.dropdown.open{display:block}
.dd-item{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:13.5px}
.dd-item:hover,.dd-item.on{background:var(--chip)}
.dd-item span{color:var(--ink2);font-size:11.5px}
#areas{display:flex;gap:3px;background:var(--chip);border-radius:12px;padding:3px;overflow:hidden}
#areas button{padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink2)}
#areas button:hover{color:var(--ink)}
#areas button.on{background:var(--red);color:#fff}
#areaSelect{display:none;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:13px;padding:0 8px}
.spacer{flex:1}
.tb-btn{height:36px;min-width:36px;padding:0 10px;border-radius:11px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;background:var(--chip);position:relative;white-space:nowrap}
.tb-btn:hover{background:rgba(227,10,23,.09)}
.menuwrap{position:relative}
.menuwrap .dropdown{left:auto;right:0}
#clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;padding:0 6px;white-space:nowrap}
#clock small{font-weight:600;color:var(--ink2);font-size:11px;margin-left:4px}
#alertBadge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:none;place-items:center}
#alertsMenu{width:330px}
.alert{display:flex;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.5px;line-height:1.35}
.alert b{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:700;min-width:38px}
.alert i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--teal)}
.alert.warn i{background:var(--warn)} .alert.bad i{background:var(--red)} .alert.ok i{background:var(--ok)}
#kpis{position:fixed;top:80px;left:12px;display:flex;gap:10px;z-index:5}
.kpi{width:178px;padding:12px 14px 12px}
.kpi .k{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--ink2);font-weight:700;margin-left:3px}
.kpi .bar{height:4px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.kpi .bar div{height:100%;background:var(--red);border-radius:3px;transition:width .5s}
#detail{position:fixed;top:80px;right:12px;width:316px;max-height:calc(100% - 352px);overflow:auto;padding:16px;z-index:6;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
#detail.hidden{transform:translateX(30px);opacity:0;pointer-events:none}
.d-type{font-size:11px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.08em}
.d-name{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 2px}
.d-sub{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.d-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--chip)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--chip);border-radius:11px;padding:9px 10px}
.stat .k{font-size:10.5px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:16px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums}
.stat.wide{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--chip)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pill.warn i{background:var(--warn)} .pill.bad i{background:var(--red)}
.meter{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.meter div{height:100%;background:var(--red)}
.d-list{margin-top:10px;font-size:12.5px}
.d-list div{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line)}
.d-list div span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
#tracker{position:fixed;left:12px;bottom:12px;width:420px;padding:14px 16px 16px;z-index:5}
.t-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.t-head{gap:10px} .t-head b{font-size:14px;white-space:nowrap} .t-head span{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.steps{display:flex;align-items:flex-start;position:relative}
.step{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink2);position:relative}
.step .dot{width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:var(--glass);border:2px solid var(--line);position:relative;z-index:1}
.step::before{content:'';position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done .dot{background:var(--red);border-color:var(--red)} .step.done::before{background:var(--red)}
.step.now .dot{background:#fff;border-color:var(--red);box-shadow:0 0 0 4px rgba(227,10,23,.18)} .step.now{color:var(--ink)} .step.now::before{background:var(--red)}
.t-empty{font-size:13px;color:var(--ink2);padding:6px 0 2px}
#tablebox{position:fixed;right:12px;bottom:12px;width:min(620px,calc(100% - 460px));height:250px;display:flex;flex-direction:column;z-index:5;overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px 10px 6px;align-items:center}
.tabs button{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.tabs button.on{background:var(--chip);color:var(--ink);box-shadow:inset 0 -2px 0 var(--red)}
.tabs .live{margin-left:auto;font-size:11px;font-weight:800;color:var(--red);display:flex;align-items:center;gap:6px;padding-right:6px}
.tabs .live i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.tbl{overflow:auto;flex:1;padding:0 6px 8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--glass);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:800;padding:6px 8px;backdrop-filter:blur(6px)}
td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer} tr.row:hover td{background:var(--chip)} tr.row.sel td{background:rgba(227,10,23,.08)}
td b{font-weight:800}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:80px;transition:opacity .8s;font-size:12px;color:var(--ink2);padding:7px 12px;border-radius:20px;z-index:4;white-space:nowrap;pointer-events:none}
#label{position:fixed;left:0;top:0;z-index:4;pointer-events:none;transform:translate(-50%,-100%);display:none}
#label .lb{background:var(--red);color:#fff;font-weight:800;font-size:13px;padding:6px 11px;border-radius:10px;box-shadow:0 6px 16px rgba(227,10,23,.35);white-space:nowrap}
#label .lb small{display:block;font-weight:600;font-size:11px;opacity:.85}
#label::after{content:'';display:block;width:2px;height:16px;background:var(--red);margin:0 auto}
.mini-steps{display:none}
#tableToggle{display:none}
body.record, body.record *{cursor:none!important}
body.record .chrome{display:none!important}
body.record #kpis{top:16px;left:16px}
@media (max-width: 1100px){ #areas{display:none} #areaSelect{display:block} #tablebox{width:calc(100% - 460px)} }
@media (max-width: 1000px) and (min-width: 721px){
  .logo small{display:none} .search{flex:0 1 150px} #weatherName{display:none} #hint{display:none}
  #topbar{gap:6px;padding:0 8px 0 10px} .tb-btn{min-width:34px;padding:0 8px} #areaSelect{max-width:128px} #clock{font-size:14px;padding:0 2px} #clock small{display:none} .kpi .k{white-space:nowrap;font-size:9px}
  .kpi{width:148px;padding:10px 12px} .kpi .v{font-size:22px} .kpi .k{font-size:9.5px}
  #tracker{width:330px;padding:12px 12px 14px} .step{font-size:9.5px}
  #detail{width:282px;top:178px;max-height:calc(100% - 340px);padding:14px} .d-name{font-size:19px}
  #tableToggle{display:flex} #tablebox{display:none;width:auto;left:354px;height:220px} #tablebox.open{display:flex}
}
@media (max-width: 720px){
  #topbar{height:auto;flex-wrap:wrap;padding:8px;gap:6px;top:8px;left:8px;right:8px}
  .logo small{display:none} .search{order:5;flex:1 1 100%} .spacer{display:none}
  #kpis{top:auto;bottom:12px;left:8px;right:8px;gap:6px}
  .kpi{flex:1;width:auto;padding:8px 10px} .kpi .v{font-size:19px} .kpi .k{font-size:9.5px}
  #tracker,#hint{display:none}
  #tableToggle{display:flex}
  #tablebox{left:8px;right:8px;width:auto;bottom:86px;height:42vh;display:none} #tablebox.open{display:flex}
  #detail{top:auto;bottom:0;left:0;right:0;width:auto;max-height:58vh;border-radius:20px 20px 0 0;padding:20px 16px 18px;z-index:12}
  #detail::before{content:'';position:absolute;top:7px;left:50%;width:40px;height:4px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
  #detail.hidden{transform:translateY(105%)}
  .mini-steps{display:flex;margin:12px 0 4px}
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="boot">Loading the strait…</div>
<div id="label"><div class="lb"></div></div>

<header id="topbar" class="glass chrome">
  <div class="logo">
    <div class="mark"><svg class="ico" viewBox="0 0 24 24" style="stroke:#fff"><path d="M3 15h18l-2.5 4.5h-13z"/><path d="M6 15v-4h12v4"/><path d="M10 11V7h3v4"/><path d="M2 21c2 0 2-1 4-1s2 1 4 1 2-1 4-1 2 1 4 1 2-1 4-1"/></svg></div>
    <div>Vapur<small>Strait ferry operations</small></div>
  </div>
  <div class="search">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <input id="search" placeholder="Search ferries, piers, ships…" autocomplete="off" spellcheck="false">
    <div id="searchResults" class="dropdown glass"></div>
  </div>
  <nav id="areas"></nav>
  <select id="areaSelect" aria-label="Area"></select>
  <div class="spacer"></div>
  <div class="menuwrap">
    <button class="tb-btn" id="weatherBtn" aria-haspopup="true"><span id="weatherIco"></span><span id="weatherName">Sunny</span></button>
    <div id="weatherMenu" class="dropdown glass"></div>
  </div>
  <div id="clock">09:40</div>
  <div class="menuwrap">
    <button class="tb-btn" id="alertsBtn" aria-label="Alerts"><svg class="ico" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span id="alertBadge"></span></button>
    <div id="alertsMenu" class="dropdown glass"></div>
  </div>
  <button class="tb-btn" id="tableToggle" aria-label="Live table"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M10 10v9"/></svg></button>
  <button class="tb-btn" id="soundBtn" aria-label="Sound"></button>
  <button class="tb-btn" id="dayNight" aria-label="Day / night"></button>
</header>

<section id="kpis">
  <div class="kpi glass"><div class="k">Passengers this hour</div><div class="v" id="kPax">0</div><div class="bar"><div id="kPaxBar" style="width:0%"></div></div></div>
  <div class="kpi glass"><div class="k">On-time departures</div><div class="v" id="kOnTime">100<small>%</small></div><div class="bar"><div id="kOnTimeBar" style="width:100%"></div></div></div>
  <div class="kpi glass"><div class="k">Ferries in service</div><div class="v" id="kService">6<small>/ 6</small></div><div class="bar"><div id="kServiceBar" style="width:100%"></div></div></div>
</section>

<aside id="detail" class="glass chrome hidden"></aside>

<section id="tracker" class="glass chrome">
  <div class="t-head"><b id="tName">Voyage tracker</b><span id="tSub"></span></div>
  <div id="tBody"></div>
</section>

<section id="tablebox" class="glass chrome">
  <div class="tabs" id="tabs">
    <button data-tab="ferries" class="on">Ferries</button><button data-tab="piers">Piers</button><button data-tab="traffic">Strait traffic</button>
    <span class="live"><i></i>LIVE</span>
  </div>
  <div class="tbl"><table id="tbl"></table></div>
</section>

<div id="hint" class="glass chrome">Drag to pan · Right-drag to rotate · Scroll to zoom · Click anything</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   FLAGS, RNG, CONSTANTS
   ============================================================ */
const QS = new URLSearchParams(location.search);
const LOW = QS.has('low');
const RECORD = QS.has('record');

let _seed = 20241016;
function rand(){ _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a,b)=> a + (b-a)*rand();
const pick = arr => arr[Math.floor(rand()*arr.length)];
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const smooth = (a,b,v)=>{ const t = clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
const TAU = Math.PI*2;

const HALF = 52;          // strait half width
const LANE = 8;           // tanker lane half width
const QUAY_H = 1.6;       // quay height above water
const BRIDGE_Z = -45;
const CARF_Z = 40;
const CROSS_Z = 95;       // pedestrian crossing on the European road
const ISLAND = { x:-22, z:140 };
const MOSQUE = { x:104, z:74 };
const TOWER  = { x:-98, z:-6 };

function shoreHalf(side, z){ return HALF + 5*Math.sin(z*0.017 + side*1.3) + 3*Math.sin(z*0.043 + side*2.1); }
function shoreX(side, z){ return side*shoreHalf(side, z); }
function inland(x, z){ const side = x<0?-1:1; return Math.abs(x) - shoreHalf(side, z); }

function landHeight(x, z){
  const side = x<0?-1:1;
  const s = Math.abs(x) - shoreHalf(side, z);
  let h;
  if (s < -1.6) h = -6;
  else if (s < 0) h = lerp(-6, QUAY_H, (s+1.6)/1.6);
  else if (s < 19) h = QUAY_H;
  else {
    const k = s - 19;
    const amp = 30 * (0.72 + 0.28*Math.sin(z*0.021 + side*0.7));
    h = QUAY_H + amp*(1 - Math.exp(-k/34)) + 2.6*Math.sin(x*0.07)*Math.sin(z*0.055)*smooth(0,20,k) + 0.04*k;
  }
  const di = Math.hypot(x-ISLAND.x, z-ISLAND.z);
  if (di < 10) h = Math.max(h, lerp(QUAY_H+1.4, -6, smooth(5.5, 10, di)));
  return h;
}

/* ============================================================
   RENDERER, SCENE, CAMERA, CONTROLS
   ============================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !LOW;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const SKY_DAY = new THREE.Color('#dfeae7');
scene.background = SKY_DAY.clone();
scene.fog = new THREE.Fog(SKY_DAY.clone(), 280, 680);

const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 1, 1600);
camera.position.set(190, 170, 210);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0, 0);
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.screenSpacePanning = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 22;
controls.maxDistance = 360;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = 1.27;
controls.zoomSpeed = 1.1;

function clampCamera(){
  const t = controls.target;
  const ox = t.x, oz = t.z;
  t.x = clamp(t.x, -150, 150); t.z = clamp(t.z, -175, 175); t.y = clamp(t.y, 0, 40);
  camera.position.x += t.x - ox; camera.position.z += t.z - oz;
  const minY = Math.max(3, landHeight(camera.position.x, camera.position.z) + 4);
  if (camera.position.y < minY) camera.position.y = minY;
}

/* lights */
const hemi = new THREE.HemisphereLight(0xf4f1e8, 0x6f8f86, 1.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(120, 200, 80);
sun.castShadow = !LOW;
sun.shadow.mapSize.set(1024, 1024);
const sc = sun.shadow.camera;
sc.left = -190; sc.right = 190; sc.top = 190; sc.bottom = -190; sc.near = 10; sc.far = 700;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.6;
scene.add(sun); scene.add(sun.target);

/* ============================================================
   MATERIALS + GEOMETRY HELPERS
   ============================================================ */
const matStatic = new THREE.MeshLambertMaterial({ vertexColors:true, flatShading:true });
// glow material: diffuse dark, emissive scaled by night factor; per-instance colour multiplies the emissive
function makeGlowMat(diffuse, emissive){
  const m = new THREE.MeshLambertMaterial({ color:diffuse, emissive:emissive, emissiveIntensity:0 });
  m.onBeforeCompile = sh => {
    sh.vertexShader = 'varying vec3 vGlow;\n' + sh.vertexShader.replace('#include <color_vertex>',

    sh.fragmentShader = 'varying vec3 vGlow;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>',
      '#include <emissivemap_fragment>\n totalEmissiveRadiance *= vGlow;');

}

  cyl: new THREE.CylinderGeometry(1,1,1,10),
  cyl6: new THREE.CylinderGeometry(1,1,1,6),
  cone4: new THREE.ConeGeometry(1,1,4),

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();

class Builder {
  constructor(){ this.parts = []; }
  add(geo, color, x=0, y=0, z=0, sx=1, sy=1, sz=1, ry=0, rx=0, rz=0){
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
    _e.set(rx, ry, rz, 'YXZ'); _q.setFromEuler(_e);
    _m4.compose(_v.set(x,y,z), _q, _s.set(sx,sy,sz));
    g.applyMatrix4(_m4);
    const c = new THREE.Color(color), n = g.attributes.position.count, arr = new Float32Array(n*3);
    for (let i=0;i<n;i++){ arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr,3));
    this.parts.push(g); return this;
  }
  // box whose base sits at y
  boxB(color, x,y,z, w,h,d, ry=0){ return this.add(G.box, color, x, y+h/2, z, w,h,d, ry); }
  cylB(color, x,y,z, r,h, seg=G.cyl, rTop=null){ return this.add(seg, color, x, y+h/2, z, r,h,r); }
  geometry(){ const g = mergeGeometries(this.parts, false); this.parts.length = 0; return g; }
  mesh(mat=matStatic){ return new THREE.Mesh(this.geometry(), mat); }
}
// rotate a local (u along 'out', a across) offset into world
function frameXZ(ox, oz, outx, outz, u, a){ return [ox + outx*u - outz*a, oz + outz*u + outx*a]; }

function axis(ranges){ const a=[]; for (const [f,t,st] of ranges){ for (let v=f; v<t-1e-6; v+=st) a.push(v); } a.push(ranges[ranges.length-1][1]); return a; }
function buildTerrain(){
  const XS = axis([[-340,-130,10],[-130,130,2],[130,340,10]]);
  const ZS = axis([[-480,-210,10],[-210,210,3],[210,480,10]]);
  const nx = XS.length, nz = ZS.length;
  const pos = new Float32Array(nx*nz*3), col = new Float32Array(nx*nz*3);
  const cSand = new THREE.Color('#c8bb98'), cBank = new THREE.Color('#a69e8e'), cQuay = new THREE.Color('#d9d1c0'),
        cGrass = new THREE.Color('#9db86f'), cGrass2 = new THREE.Color('#86a85e'), cHigh = new THREE.Color('#b3c47e'), tmp = new THREE.Color();
  let i = 0;
  for (let iz=0; iz<nz; iz++) for (let ix=0; ix<nx; ix++){
    const x = XS[ix], z = ZS[iz], h = landHeight(x,z), s = inland(x,z);
    pos[i*3]=x; pos[i*3+1]=h; pos[i*3+2]=z;
    const di = Math.hypot(x-ISLAND.x, z-ISLAND.z);
    if (di < 10 && h > -5) tmp.copy(h > QUAY_H+0.6 ? cGrass : cBank);
    else if (h < -4) tmp.copy(cSand);
    else if (s < 0.2) tmp.copy(cBank);
    else if (s < 19.5) tmp.copy(cQuay);
    else { const n = 0.5+0.5*Math.sin(x*0.13+z*0.07)*Math.sin(z*0.11-x*0.05); tmp.copy(cGrass).lerp(cGrass2, n).lerp(cHigh, smooth(15, 34, h)*0.6); }
    col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b; i++;
  }
  const idx = [];
  for (let iz=0; iz<nz-1; iz++) for (let ix=0; ix<nx-1; ix++){
    const a = iz*nx+ix, b = a+1, c = a+nx, d = c+1;
    idx.push(a,c,b, b,c,d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors:true, flatShading:true }));
  m.receiveShadow = true;
  return m;
}
const terrain = buildTerrain();

const waterMat = new THREE.MeshLambertMaterial({ color:'#2f9f9a', flatShading:true });
waterMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, waterU);
  sh.vertexShader = 'uniform float uTime; uniform float uAmp; uniform float uChop; varying vec3 vWP; varying float vWave;\n' +
    sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec2 p = position.xz;
      float w = sin(p.x*0.08 + uTime*0.9)*0.5 + sin(p.y*0.11 - uTime*1.2)*0.35 + sin((p.x+p.y)*0.05 + uTime*0.6)*0.6;
      w += uChop*(sin(p.x*0.35 + uTime*2.6)*0.4 + sin(p.y*0.42 + p.x*0.2 - uTime*3.1)*0.35);
      transformed.y += w*uAmp; vWave = w;
      vWP = (modelMatrix*vec4(transformed,1.0)).xyz;`);
  sh.fragmentShader = 'uniform float uTime; uniform vec3 uLane; uniform vec3 uCrest; varying vec3 vWP; varying float vWave;\n' +
    sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      float lane = 1.0 - smoothstep(5.0, 15.0, abs(vWP.x));
      diffuseColor.rgb = mix(diffuseColor.rgb, uLane, lane*0.5);
      float streak = smoothstep(0.86, 1.0, sin(vWP.z*0.12 + uTime*1.6 + sin(vWP.x*0.5)*1.4)) * lane;
      diffuseColor.rgb += streak*0.07;
      diffuseColor.rgb = mix(diffuseColor.rgb, uCrest, smoothstep(0.9, 1.6, vWave)*0.16);`);

function waveH(x, z, t){
  let w = Math.sin(x*0.08 + t*0.9)*0.5 + Math.sin(z*0.11 - t*1.2)*0.35 + Math.sin((x+z)*0.05 + t*0.6)*0.6;
  w += WATER.chop*(Math.sin(x*0.35 + t*2.6)*0.4 + Math.sin(z*0.42 + x*0.2 - t*3.1)*0.35);
  return w*WATER.amp;
}

function hullShape(L, W, bow){
  const s = new THREE.Shape(), hl = L/2, hw = W/2, b = L*bow;
  s.moveTo(0, -hl);
  s.quadraticCurveTo(hw, -hl + b*0.55, hw, -hl + b);
  s.lineTo(hw, hl - 1.3);
  s.quadraticCurveTo(hw, hl, 0, hl);
  s.quadraticCurveTo(-hw, hl, -hw, hl - 1.3);
  s.lineTo(-hw, -hl + b);
  s.quadraticCurveTo(-hw, -hl + b*0.55, 0, -hl);
  return s;
}

   ============================================================ */
function makePath(pts){ const cum=[0]; for (let i=1;i<pts.length;i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1])); return { pts, cum, len:cum[cum.length-1] }; }
function samplePath(P, s){
  s = clamp(s, 0, P.len); let lo = 0, hi = P.cum.length-1;
  while (hi - lo > 1){ const m = (lo+hi)>>1; if (P.cum[m] <= s) lo = m; else hi = m; }
  const a = P.pts[lo], b = P.pts[hi], L = (P.cum[hi]-P.cum[lo]) || 1, t = (s - P.cum[lo])/L;
  return { x: lerp(a[0],b[0],t), z: lerp(a[1],b[1],t), dx:(b[0]-a[0])/L, dz:(b[1]-a[1])/L };
}
function bezierPts(p0, c1, c2, p3, n, lat){
  const out = [];
  for (let i=0;i<=n;i++){
    const t = i/n, u = 1-t;
    let x = u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p3[0];
    let z = u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p3[1];
    const dx = 3*u*u*(c1[0]-p0[0]) + 6*u*t*(c2[0]-c1[0]) + 3*t*t*(p3[0]-c2[0]);
    const dz = 3*u*u*(c1[1]-p0[1]) + 6*u*t*(c2[1]-c1[1]) + 3*t*t*(p3[1]-c2[1]);
    const l = Math.hypot(dx,dz) || 1, off = lat*Math.sin(Math.PI*t);
    out.push([x - dz/l*off, z + dx/l*off]);
  }
  return out;
}

/* lane crossing reservation */
// a crossing occupies the z-interval [z0,z1] of the lane; it is granted only if the tanker's swept
// interval over the crossing time and every other granted crossing stay clear of it
function crossClear(v, cr, T){
  if (TANKER.active){
    const tz1 = TANKER.z + TANKER.dir*TANKER.v*ENV.speedF*T;
    const lo = Math.min(TANKER.z, tz1) - TANKER.len/2 - 12, hi = Math.max(TANKER.z, tz1) + TANKER.len/2 + 12;
    if (cr.z1 + 4 > lo && cr.z0 - 4 < hi) return false;
  }
  for (const o of MOVERS) if (o !== v && o.cross && o.cross.granted && !o.cross.done && cr.z1 + 14 > o.cross.z0 && cr.z0 - 14 < o.cross.z1) return false;
  return true;
}
/* give-way between vessels: returns the vessel we must yield to */
function mustYield(a){
  if (a.ignoreYield > 0) return null;
  if (a.cross && a.cross.granted && !a.cross.done && a.inLane) return null;
  const fx = a.mdx, fz = a.mdz;
  for (const b of MOVERS){
    if (b === a || !b.obstacle) continue;
    const rx = b.x - a.x, rz = b.z - a.z;
    if (rx*rx + rz*rz > 60*60) continue;
    const fwd = rx*fx + rz*fz, lat = Math.abs(rx*fz - rz*fx);
    const reach = (a.len + b.len)/2 + 9, width = (a.wid + b.wid)/2 + 3;
    if (fwd > 0 && fwd < reach && lat < width){
      const fwdB = -rx*b.mdx - rz*b.mdz, latB = Math.abs(-rx*b.mdz + rz*b.mdx);
      const aAheadOfB = b.v > 0.3 && fwdB > 0 && fwdB < reach && latB < width;
      if (!aAheadOfB || a.pri > b.pri) return b;
    }
    if (a.pri > b.pri && b.v > 0.3 && fwd > -2){
      const sp = Math.max(a.v, 1.5), dvx = b.mdx*b.v - fx*sp, dvz = b.mdz*b.v - fz*sp, dv2 = dvx*dvx + dvz*dvz;
      if (dv2 > 0.01){
        const t = -(rx*dvx + rz*dvz)/dv2;
        if (t > 0 && t < 7){ const cx = rx + dvx*t, cz = rz + dvz*t; if (Math.hypot(cx,cz) < (a.wid+b.wid)/2 + (a.len+b.len)/4 + 2) return b; }
      }
    }
  }
  return null;
}

function playHorn(dist, low){

function stageOf(f){
  switch (f.phase){
    case 'docked': return f.trips > 0 ? 5 : 0;
    case 'gangDown': case 'alight': case 'board': case 'gangUp': case 'waitDep': return 1;
    case 'reverse': case 'pivot': return 2;
    case 'cruise': {
      const h = f.leg.hold;
      if (h) return (f.s < h.s || (f.cross && !f.cross.granted)) ? 2 : f.s < h.sEnd ? 3 : 4;
      const k = f.s / f.leg.cruise.len; return k < 0.3 ? 2 : k < 0.7 ? 3 : 4;
    }
    default: return 4;
  }
}
function statusOf(f){
  if (f.phase === 'waitDep' && ENV.cancelled) return 'Cancelled (storm)';
  if (f.holding) return 'Holding for ' + TANKER.name;
  if (f.yielding) return 'Giving way';
  if (f.phase === 'queue') return f.dest.berths.some(b => b.res === f) ? 'Waiting to berth' : 'Waiting for berth';

}
function setPhase(f, ph){ f.phase = ph; f.phaseT = 0; }
function demand(){ const h = ((SIM.min + SIM.offset)/60) % 24; return 0.35 + 1.2*Math.exp(-((h-8.2)**2)/2) + 1.1*Math.exp(-((h-18)**2)/2.5) + 0.4*smooth(10,13,h)*(1-smooth(20,23,h)); }

function tryReserve(f){

  return false;
}
function departFerry(f, queued){
  f.releaseBerth = f.pier.berths.find(b => b.occ === f) || null;   // freed once we are clear of the pier

function updateFerry(f, dt, t){

    case 'alight': {

      if (f.zoneP && f.s > 34){ if (f.zoneP.zone === f) f.zoneP.zone = null; f.zoneP = null; }
      const canBerth = f.dest.berths.some(b => b.res === f) && (!f.dest.zone || f.dest.zone === f);

function updateCarFerry(dt){

        const [dx, dz] = deckWorld(slot);
        front.path = makePath([[front.x, front.z], [front.x - side*1.5, CARF_Z + 3], [slip.rx - side*3.5, CARF_Z], [dx, dz]]);
        c.phaseT = 0;
      }

      if ((onCount >= 6 || !q.length || (q[0] && q[0].state !== 'queue')) && !boarding && c.phaseT > 1.5){ setPhase(c, 'waitDep'); }

    }

    else { tx = g.cx + Math.cos(g.a)*g.r; tz = g.cz + Math.sin(g.a)*g.r; ty = g.h + Math.sin(t*0.5+g.ph)*2; }
    const k = Math.min(1, dt*1.6), px = g.x, pz = g.z;
    g.x += (tx-g.x)*k; g.y += (ty-g.y)*k; g.z += (tz-g.z)*k;
    const yaw = Math.atan2(g.x-px, g.z-pz) || g.yaw || 0; g.yaw = yaw;
    const flap = 0.35 + 0.75*Math.abs(Math.sin(t*7 + g.ph));
    setInst(gullMesh, i, g.x, g.y, g.z, yaw, 1, flap, 1, 0, Math.sin(t*0.9+g.ph)*0.25);
  });
  gullMesh.instanceMatrix.needsUpdate = true;
}

}

const ease = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
function flyTo(tgt, camPos, dur=1.5, obj=null){
  FLY.active = true; FLY.t = 0; FLY.dur = dur; FLY.obj = obj;

function camFor(tgt, dist, phi){
  const off = _v.copy(camera.position).sub(controls.target), th = Math.atan2(off.x, off.z);
  return new THREE.Vector3(tgt.x + dist*Math.sin(phi)*Math.sin(th), tgt.y + dist*Math.cos(phi), tgt.z + dist*Math.sin(phi)*Math.cos(th));
}

}

function updateCamera(dt){

    FLY.t += dt/FLY.dur; const k = ease(Math.min(1, FLY.t));
    if (FLY.obj){ FLY.tt.copy(FLY.obj.pos); FLY.tp.copy(FLY.tt).add(FLY.off); }

  }
  if (o.type === 'lighthouse'){
    const on = ENV.night > 0.25 || ENV.fog || ENV.weather === 'lodos';
    return `${close}<div class="d-type">Lighthouse</div><div class="d-name">${esc(o.name)}</div><div class="d-sub">Island lighthouse · southern approach</div>
      <span class="pill"><i></i>${on ? 'Beam sweeping' : 'Standby (daylight)'}</span>
      <div class="stats" style="margin-top:12px">${stat('Character', 'Fl W 10s')}${stat('Range', '14 nm')}${stat('Focal height', '24 m')}${stat('Visibility', ENV.fog ? '0.4 nm' : ENV.weather === 'lodos' ? '2 nm' : '10+ nm')}</div>`;
  }
  return '';
}
function renderDetail(){
  const el = $('detail');
  if (!SEL){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = detailHtml(SEL);
  $('dClose').onclick = () => deselect();
}
function renderTracker(){
  const f = SEL && SEL.type === 'ferry' ? SEL : null;
  if (!f){ $('tName').textContent = 'Voyage tracker'; $('tSub').textContent = ''; $('tBody').innerHTML = '<div class="t-empty">Select a ferry on the map or in the table to follow its voyage.</div>'; return; }
  $('tName').textContent = f.name;
  const to = isSailing(f) ? f.dest.name : PIER[nextPierKey(f)].name;
  $('tSub').textContent = `${f.pier.name} → ${to} · ${statusOf(f)}`;
  $('tBody').innerHTML = stepsHtml(stageOf(f));
}

/* live table */
let TAB = 'ferries';
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; TAB = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); renderTable(true); });
$('tbl').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (!r) return; const o = CLICK.find(o => o.id === r.dataset.id); if (o) select(o); });
const zone = z => z < -80 ? 'North strait' : z < -10 ? 'Bridge reach' : z < 70 ? 'Mid strait' : 'South strait';
function renderTable(){
  let h = '';
  const row = (o, cells) => `<tr class="row${SEL === o ? ' sel' : ''}" ${o && o.id ? `data-id="${o.id}"` : ''}>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;
  if (TAB === 'ferries'){
    h = '<tr><th>Ferry</th><th>Route</th><th>Status</th><th>Pax</th><th>Speed</th><th>Next dep.</th></tr>';
    for (const f of FERRIES){
      const st = statusOf(f), to = isSailing(f) ? f.dest.name : PIER[nextPierKey(f)].name;
      h += row(f, [`<b>${esc(f.name)}</b>`, `${f.pier.name} → ${to}`, `<span class="pill ${pillCls(st)}"><i></i>${st}</span>`, f.onboard.toLocaleString('en'), (f.v*KN).toFixed(1)+' kn', isSailing(f) ? 'ETA ' + fmtTime(etaOf(f)) : (ENV.cancelled ? 'Cancelled' : fmtTime(f.nextSched))]);
    }
  } else if (TAB === 'piers'){
    h = '<tr><th>Pier</th><th>Area</th><th>Berths</th><th>Waiting</th><th>Next departure</th><th>Deps today</th></tr>';
    for (const p of PIERS){
      const nxt = FERRIES.filter(f => f.pier === p && !isSailing(f)).sort((a,b) => a.nextSched - b.nextSched)[0];
      h += row(p, [`<b>${p.name}</b>`, p.area, p.berths.filter(b => b.occ).length + ' / 2' + (p.berths.some(b=>b.res) ? ' · 1 inbound' : ''), Math.round(p.waiting).toLocaleString('en'), nxt ? `${esc(nxt.name)} ${ENV.cancelled ? 'cancelled' : fmtTime(nxt.nextSched)}` : '—', p.deps]);
    }
  } else {
    h = '<tr><th>Vessel</th><th>Type</th><th>Status</th><th>Speed</th><th>Position</th></tr>';
    h += row(TANKER, [`<b>${TANKER.name}</b>`, 'Tanker', TANKER.active ? '<span class="pill"><i></i>Priority transit</span>' : '<span class="pill warn"><i></i>Outside strait</span>', (TANKER.active ? TANKER.v*ENV.speedF*KN : 0).toFixed(1)+' kn', TANKER.active ? zone(TANKER.z) + (TANKER.dir>0?' · southbound':' · northbound') : '—']);
    h += row(CARF, [`<b>${CARF.name}</b>`, 'Car ferry', CARF.phase === 'cruise' ? (CARF.holding ? '<span class="pill warn"><i></i>Holding</span>' : '<span class="pill"><i></i>Crossing</span>') : '<span class="pill"><i></i>At slip</span>', (CARF.v*KN).toFixed(1)+' kn', 'Mid strait · car ferry line']);
    for (const b of BOATS) h += row(null, [`<b>${b.name}</b>`, 'Fishing boat', `<span class="pill"><i></i>${ENV.cancelled ? 'Sheltering' : 'Fishing'}</span>`, (Math.abs(b.w*b.r)*KN*ENV.speedF).toFixed(1)+' kn', zone(b.az) + (b.ax < 0 ? ' · European side' : ' · Asian side')]);
  }
  $('tbl').innerHTML = h;
}
function renderKpis(){
  const pax = PAXLOG.reduce((a,b) => a + b.n, 0);
  $('kPax').textContent = pax.toLocaleString('en'); $('kPaxBar').style.width = Math.min(100, pax/60) + '%';
  const ot = DEPS.total ? Math.round(DEPS.ontime/DEPS.total*100) : 100;
  $('kOnTime').innerHTML = ot + '<small>%</small>'; $('kOnTimeBar').style.width = ot + '%';
  const inService = ENV.cancelled ? 0 : FERRIES.length + 1;
  $('kService').innerHTML = inService + `<small>/ ${FERRIES.length + 1}</small>`; $('kServiceBar').style.width = (inService/(FERRIES.length+1)*100) + '%';
  $('clock').innerHTML = fmtTime(SIM.min) + '<small>LIVE</small>';
}
let uiT = 0, tblT = 0;
function updateUI(dt){
  uiT += dt; tblT += dt;
  if (uiT > 0.25){ uiT = 0; renderKpis(); if (SEL) renderDetail(); renderTracker(); }
  if (tblT > 0.6){ tblT = 0; if (!document.querySelector('#tbl tr.row:hover')) renderTable(); }
}
setTimeout(() => { $('hint').style.opacity = 0; }, 14000);

/* ============================================================
   WEATHER + DAY / NIGHT
   ============================================================ */
const WX = {
  sunny:  { near:280, far:680, amp:0.28, chop:0.0, rock:0.025, speed:1.00, light:1.00, sky:'#dfeae7', water:'#2f9f9a', wet:1.00, rain:0, cancel:false },
  poyraz: { near:230, far:620, amp:0.62, chop:1.0, rock:0.075, speed:0.88, light:0.92, sky:'#d3e2e8', water:'#2a8f95', wet:0.97, rain:0, cancel:false },
  lodos:  { near:110, far:560, amp:1.00, chop:1.5, rock:0.12,  speed:0.75, light:0.50, sky:'#7f8c93', water:'#3c6f72', wet:0.80, rain:1, cancel:true },
  fog:    { near:8,   far:270, amp:0.12, chop:0.0, rock:0.012, speed:0.55, light:0.78, sky:'#d5dbda', water:'#4d9a98', wet:0.95, rain:0, cancel:false },
};
const CUR = { near:280, far:680, amp:0.28, chop:0, rock:0.025, speed:1, light:1, wet:1, rain:0, sky:new THREE.Color('#dfeae7'), water:new THREE.Color('#2f9f9a') };
const NIGHT_SKY = new THREE.Color('#13253a'), NIGHT_WATER = new THREE.Color('#1d5262'), DUSK = new THREE.Color('#f2b183');
const tmpC = new THREE.Color(), tmpC2 = new THREE.Color();
applyWeather = (key, silent=false) => {
  if (!WX[key]) return;
  const prev = ENV.weather; ENV.weather = key; ENV.fog = key === 'fog';
  const wasCancelled = ENV.cancelled; ENV.cancelled = WX[key].cancel;
  setWeatherButton(key);
  if (wasCancelled && !ENV.cancelled){ FERRIES.forEach((f,i) => { if (f.phase === 'waitDep') f.nextSched = Math.max(f.nextSched, SIM.min + 2 + i*1.5); }); CARF.nextSched = SIM.min + 3; }
  if (silent || prev === key) return;
  if (key === 'sunny') pushAlert('Weather cleared: sunny, calm sea. Full timetable.', 'ok');
  if (key === 'poyraz') pushAlert('Poyraz (north wind) 28 kn: choppy waves, reduced speed, expect delays.', 'warn');
  if (key === 'lodos') pushAlert('Lodos storm warning: all ferry services cancelled until further notice.', 'bad');
  if (key === 'fog') pushAlert('Fog advisory: visibility under 400 m. Ferries at reduced speed, fog horns active.', 'warn');
};
toggleNight = () => {
  const h = (((SIM.min + SIM.offset) % 1440) + 1440) % 1440 / 60;
  const target = ENV.night < 0.5 ? 21.5 : 9.5;
  let diff = (target - h)*60; if (diff < 0) diff += 1440;
  SIM.warp = diff;
};
function renderDayBtn(){ $('dayNight').innerHTML = ENV.night > 0.5 ? ICON.sun : ICON.moon; $('dayNight').title = ENV.night > 0.5 ? 'Switch to day' : 'Switch to night'; }

/* rain */
const RAIN_N = LOW ? 2500 : 5000;
// rain drops are short line streaks: two vertices per drop, one LineSegments object
const rainGeo = new THREE.BufferGeometry(), rainPos = new Float32Array(RAIN_N*6), rainVel = new Float32Array(RAIN_N);
const RAIN_LEN = 2.2, RAIN_SLANT = 0.5;
for (let i=0;i<RAIN_N;i++){ const x = rr(-130,130), y = rr(0,80), z = rr(-130,130); rainPos.set([x,y,z, x+RAIN_SLANT,y+RAIN_LEN,z], i*6); rainVel[i] = rr(45,65); }
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos,3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color:'#dfe8ee', transparent:true, opacity:0, depthWrite:false }));
rain.frustumCulled = false; rain.visible = false; scene.add(rain);
/* lightning */
const boltGeo = new THREE.BufferGeometry(); boltGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(16*3),3));
const bolt = new THREE.Line(boltGeo, new THREE.LineBasicMaterial({ color:'#f4f6ff', transparent:true, opacity:1 })); bolt.visible = false; bolt.frustumCulled = false; scene.add(bolt);
const LIT = { next:5, flash:0, boltT:0 };
function strike(){
  const p = boltGeo.attributes.position.array, cx = controls.target.x + rr(-120,120), cz = controls.target.z + rr(-120,40);
  let x = cx, z = cz;
  for (let i=0;i<16;i++){ const y = 130 - i*130/15; p[i*3] = x; p[i*3+1] = Math.max(y, 0); p[i*3+2] = z; x += rr(-6,6); z += rr(-6,6); }
  boltGeo.attributes.position.needsUpdate = true; bolt.visible = true; LIT.boltT = 0.18; LIT.flash = 1;
}
/* lighthouse lamp + beam */
const lampMat = new THREE.MeshLambertMaterial({ color:'#fff6d8', emissive:'#ffe7a3', emissiveIntensity:0 });
const lhLamp = new THREE.Mesh(new THREE.SphereGeometry(0.75, 10, 8), lampMat); lhLamp.position.set(LIGHT.x, LIGHT.y, LIGHT.z); scene.add(lhLamp);
const beamGeo = (()=>{ const a = new THREE.ConeGeometry(4, 80, 14, 1, true).translate(0,-40,0).rotateZ(Math.PI/2); const b = a.clone().rotateY(Math.PI); return mergeGeometries([a, b]); })();
const beam = new THREE.Mesh(beamGeo, new THREE.MeshLambertMaterial({ color:'#000000', emissive:'#fff1c4', transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide }));
beam.material.onBeforeCompile = sh => {
  sh.vertexShader = 'varying float vBeamD;' + String.fromCharCode(10) + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>' + String.fromCharCode(10) + 'vBeamD = abs(position.x);');
  sh.fragmentShader = 'varying float vBeamD;' + String.fromCharCode(10) + sh.fragmentShader.replace('#include <alphamap_fragment>', '#include <alphamap_fragment>' + String.fromCharCode(10) + 'diffuseColor.a *= pow(1.0 - clamp(vBeamD/80.0, 0.0, 1.0), 1.6);');
};
beam.position.copy(lhLamp.position); beam.frustumCulled = false; scene.add(beam);

const fogHornT = new Map();
const sunDir = new THREE.Vector3();
let dayBtnState = -1;
function updateEnvironment(dt, t){
  // day/night warp (animated toggle)
  if (SIM.warp > 0){ const st = Math.min(SIM.warp, dt*300); SIM.offset += st; SIM.warp -= st; }
  // weather blend
  const tg = WX[ENV.weather], k = 1 - Math.exp(-dt*1.1);
  for (const key of ['near','far','amp','chop','rock','speed','light','wet','rain']) CUR[key] += (tg[key] - CUR[key])*k;
  CUR.sky.lerp(tmpC.set(tg.sky), k); CUR.water.lerp(tmpC.set(tg.water), k);
  WATER.amp = CUR.amp; WATER.chop = CUR.chop; ENV.rock = CUR.rock; ENV.speedF = CUR.speed;
  // sun
  const hour = (((SIM.min + SIM.offset) % 1440) + 1440) % 1440 / 60;
  const ang = (hour - 6)/12*Math.PI, elev = Math.sin(ang);
  const dayF = smooth(-0.14, 0.22, elev); ENV.night = 1 - dayF;
  const dusk = Math.max(0, 1 - Math.abs(elev - 0.05)/0.28) * dayF;
  if (elev > -0.05) sunDir.set(Math.cos(ang)*0.85, Math.max(0.18, elev), 0.42).normalize();
  else sunDir.set(-0.35, 0.85, 0.4).normalize();          // moonlight
  sun.position.copy(sunDir).multiplyScalar(320); sun.target.position.set(0,0,0);
  const L = CUR.light, flash = LIT.flash;
  sun.intensity = lerp(0.32, 2.4, dayF) * (0.55 + 0.45*L) + flash*1.5;
  sun.color.set('#fff1dc').lerp(DUSK, dusk*0.7).lerp(tmpC.set('#a9bcff'), ENV.night);
  hemi.intensity = lerp(0.7, 1.25, dayF) * (0.6 + 0.4*L) + flash*2.2;
  hemi.color.set('#f4f1e8').lerp(tmpC.set('#4c628a'), ENV.night);
  hemi.groundColor.set('#6f8f86').lerp(tmpC.set('#1b2a33'), ENV.night);
  // sky / fog
  tmpC2.copy(CUR.sky).lerp(DUSK, dusk*0.35).lerp(NIGHT_SKY, ENV.night*(ENV.fog ? 0.8 : 0.94));
  scene.background.copy(tmpC2); scene.fog.color.copy(tmpC2);
  scene.fog.near = CUR.near * (ENV.night > 0.5 && !ENV.fog ? 0.8 : 1); scene.fog.far = CUR.far;
  document.body.style.background = '#' + tmpC2.getHexString();
  // water + wet materials
  waterMat.color.copy(CUR.water).lerp(NIGHT_WATER, ENV.night*0.85);
  WATER_COL.copy(waterMat.color);
  waterU.uLane.value.set('#7fd0c6').lerp(waterMat.color, 0.35 + 0.5*ENV.night + (1-CUR.wet));
  matStatic.color.setScalar(CUR.wet); houseMat.color.setScalar(CUR.wet);
  // glow
  const glow = smooth(0.25, 0.85, ENV.night) + (ENV.fog ? 0.25 : 0) + (ENV.weather === 'lodos' ? 0.35 : 0);
  glowWarm.emissiveIntensity = Math.min(1.5, glow*1.4);
  glowBridge.emissiveIntensity = smooth(0.3, 0.8, ENV.night)*1.7;
  if (glowBridge.emissiveIntensity > 0.01){
    for (let i=0;i<bridgeLights.length;i++){ const x = bridgeLights[i][0]; bridgeBulbs.setColorAt(i, tmpC.setHSL(((t*0.05 + x*0.004 + (bridgeLights[i][2] > BRIDGE_Z ? 0.5 : 0)) % 1 + 1) % 1, 0.9, 0.58)); }
    bridgeBulbs.instanceColor.needsUpdate = true;
  }
  navPts.material.opacity = Math.min(1, smooth(0.3, 0.8, ENV.night) + (ENV.fog ? 0.6 : 0));
  // lighthouse
  const lh = Math.max(smooth(0.25, 0.7, ENV.night), ENV.fog ? 0.9 : 0, ENV.weather === 'lodos' ? 0.8 : 0);
  lampMat.emissiveIntensity = lh*2.2; beam.visible = lh > 0.02; beam.material.opacity = 0.35*lh;
  beam.rotation.y = t*TAU/10;
  // rain + lightning
  rain.visible = CUR.rain > 0.03;
  if (rain.visible){
    rain.material.opacity = 0.5*CUR.rain;
    const cx = controls.target.x, cz = controls.target.z;
    for (let i=0;i<RAIN_N;i++){
      const o = i*6;
      let y = rainPos[o+1] - rainVel[i]*dt, x = rainPos[o] - 12*dt*0.5, z = rainPos[o+2];
      if (y < 0){ y = 80; x = cx + rr(-130,130); z = cz + rr(-130,130); }
      rainPos[o] = x; rainPos[o+1] = y; rainPos[o+2] = z; rainPos[o+3] = x + RAIN_SLANT; rainPos[o+4] = y + RAIN_LEN; rainPos[o+5] = z;
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  if (ENV.weather === 'lodos'){ LIT.next -= dt; if (LIT.next <= 0){ strike(); LIT.next = rr(3.5, 9); } }
  LIT.flash *= Math.exp(-dt*7); if (LIT.boltT > 0){ LIT.boltT -= dt; if (LIT.boltT <= 0) bolt.visible = false; }
  // fog horns from vessels under way
  if (ENV.fog){
    for (const v of [...FERRIES, CARF, TANKER]){
      if (v.v < 0.8 || (v.type === 'tanker' && !TANKER.active)) continue;
      const n = (fogHornT.get(v) ?? rr(0, 6)) - dt;
      if (n <= 0){ horn(v, true); fogHornT.set(v, rr(10, 15)); } else fogHornT.set(v, n);
    }
  }
  const nightState = ENV.night > 0.5 ? 1 : 0;
  if (nightState !== dayBtnState){ dayBtnState = nightState; renderDayBtn(); document.body.classList.toggle('night', !!nightState); }
}

/* ============================================================
   ?record : cinematic camera gliding between areas
   ============================================================ */
const CINE = { i:0, t:0 };
if (RECORD){
  document.body.classList.add('record');
  controls.enabled = false;
  CINE.t = 0;
}
function updateCinematic(dt){
  if (!RECORD) return;
  CINE.t -= dt;
  if (CINE.t <= 0){
    CINE.i = (CINE.i + 1) % AREAS.length;
    const a = AREAS[CINE.i], tgt = new THREE.Vector3(...a.t), c = new THREE.Vector3(...a.c);
    // vary the approach angle each pass
    const off = c.clone().sub(tgt), th = rr(-0.5, 0.5); off.applyAxisAngle(_v.set(0,1,0), th);
    flyTo(tgt, tgt.clone().add(off), 6.5);
    CINE.t = 13;
  }
  if (!FLY.active){ // slow orbit while resting
    const off = _v.copy(camera.position).sub(controls.target); off.applyAxisAngle(new THREE.Vector3(0,1,0), dt*0.05); camera.position.copy(controls.target).add(off);
  }
}
renderTable(); renderTracker(); renderKpis();

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = { last: performance.now(), t: 0 };
function update(dt){
  clock.t += dt; WATER.t += dt;
  waterU.uTime.value = WATER.t; waterU.uAmp.value = WATER.amp; waterU.uChop.value = WATER.chop;
  updateWorld(dt, clock.t);
  updateEnvironment(dt, clock.t);
  updateCinematic(dt);
  updateCamera(dt);
  updateSelectionFx(clock.t);
  updateUI(dt);
}
function frame(now){
  const dt = Math.min(0.05, (now - clock.last)/1000); clock.last = now;
  update(dt);
  controls.update();
  clampCamera();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden) renderer.setAnimationLoop(null);
  else { clock.last = performance.now(); renderer.setAnimationLoop(frame); }
});
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
setInterval(()=>{ if (!document.hidden) console.log(`[Vapur] draw calls: ${renderer.info.render.calls} | triangles: ${renderer.info.render.triangles} | low=${LOW} record=${RECORD}`); }, 5000);
window.__vapur = { THREE, scene, camera, controls, renderer, FERRIES, TANKER, CARF, SIM, ENV, PIERS, ALERTS, DEPS, update, setWeather: k => applyWeather(k), toggleNight: () => toggleNight(), select: id => select(CLICK.find(o => o.id === id)) };
document.getElementById('boot').classList.add('done');
</script>
</body>
</html>
